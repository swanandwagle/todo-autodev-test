name: next-story

on:
  pull_request:
    types: [closed]

jobs:
  advance:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    concurrency:
      group: story-loop
      cancel-in-progress: false
    defaults:
      run:
        shell: cmd
    env:
      ORCHESTRATOR: C:\Projects\ai-delivery-orchestrator
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark merged story Done
        run: |
          call %ORCHESTRATOR%\.venv\Scripts\activate.bat
          cd %ORCHESTRATOR%
          python -m orchestrator.cli.jira_mark_done --project todo-autodev-test --pr "${{ github.event.pull_request.number }}"

      - name: Check dependency gate
        id: gate
        shell: pwsh
        run: |
          & "$env:ORCHESTRATOR\.venv\Scripts\python.exe" -m orchestrator.cli.dependency_gate_check --project todo-autodev-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = & "$env:ORCHESTRATOR\.venv\Scripts\python.exe" -m orchestrator.cli.dependency_gate_check --project todo-autodev-test
          echo "clear=$result" >> $env:GITHUB_OUTPUT

      - name: Run next story
        if: steps.gate.outputs.clear == 'true'
        run: |
          call %ORCHESTRATOR%\.venv\Scripts\activate.bat
          cd %ORCHESTRATOR%
          python -m orchestrator.cli.run_next_story --project todo-autodev-test

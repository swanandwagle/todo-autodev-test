name: next-story

on:
  pull_request:
    types: [closed]

jobs:
  advance:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    concurrency:
      group: story-loop
      cancel-in-progress: false
    defaults:
      run:
        shell: cmd
    env:
      ORCHESTRATOR: C:\Projects\ai-delivery-orchestrator
      PYTHON: C:\Projects\ai-delivery-orchestrator\.venv\Scripts\python.exe
    steps:
      - uses: actions/checkout@v4

      - name: Mark merged story Done
        run: |
          cd %ORCHESTRATOR%
          %PYTHON% -m orchestrator.cli.jira_mark_done --project todo-autodev-test --pr "${{ github.event.pull_request.number }}"

      - name: Check dependency gate
        id: gate
        run: |
          cd %ORCHESTRATOR%
          for /f %%i in ('%PYTHON% -m orchestrator.cli.dependency_gate_check --project todo-autodev-test') do echo clear=%%i >> %GITHUB_OUTPUT%

      - name: Run next story
        if: steps.gate.outputs.clear == 'true'
        run: |
          cd %ORCHESTRATOR%
          %PYTHON% -m orchestrator.cli.run_next_story --project todo-autodev-test
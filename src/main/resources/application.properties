spring.application.name=todo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASS:todo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.mvc.throw-exception-if-no-handler-found=true

server.tomcat.max-http-form-post-size=65536
server.tomcat.max-swallow-size=65536
